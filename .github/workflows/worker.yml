name: worker
# Manual only. The OAuth client secret is configured once with `npx wrangler secret put GITHUB_CLIENT_SECRET`
# (see docs/SETUP.md); it is never stored in this repository or in this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
